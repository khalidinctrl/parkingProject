<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Page</title>
</head>
<body>
    <h1>WELCOME TO THE CAR PAGE</h1>
    <h2>Fill in the details: </h2>

    <form method="POST">
        <label for="plate_no">Plate Number: </label>
        <input type="text" name="plate_no" placeholder="plate number" required>

        <label for="brand">Brand: </label>
        <input type="text" name="brand" placeholder="brand" required>

        <label for="model">Model: </label>
        <input type="text" name="model" placeholder="model" required>

        <label for="customer_id">Customer ID: </label>
        <input type="text" name="customer_id" placeholder="CU-0001" required><br><br>

        <button type="submit">save</button>
    </form><br>

    <a href="{{ url_for('home') }}"><button>back to home</button></a><br><br>

    <table>
        <tr>
            <th>Plate Number</th>
            <th>Brand</th>
            <th>Model</th>
            <th>Customer ID</th>
        </tr>
        {% for car in car_list %}
        <tr>
            <td>{{ car.plate_number }}</td>
            <td>{{ car.brand }}</td>
            <td>{{ car.model }}</td>
            <td>{{ car['customer id'] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
